name: 'Configure Kernel Options'
description: 'Prepare the GKI fragment (KernelSU on, GKI defaults kept)'

inputs:
  kernel_version:
    description: 'Kernel version (e.g., 6.6)'
    required: true

runs:
  using: composite
  steps:
    - name: Prepare GKI fragment
      shell: bash
      run: |
        FRAG="${{ github.workspace }}/gki.fragment"
        KERNEL_SRC="${{ github.workspace }}/kernel/common"

        # Do NOT force CONFIG_VIRTIO_*=y here.
        # The GKI build verifies its own module_outs (drivers/virtio/*.ko,
        # drivers/block/virtio_blk.ko, drivers/char/virtio_console.ko, ...), so
        # forcing those drivers built-in makes //common:kernel_<arch> fail with
        # "Unable to find ... .ko". AVD support comes from the virtual-device
        # dist target (//common-modules/virtual-device:virtual_device_<arch>_dist),
        # which ships the Image plus the virtio/goldfish .ko set for the ramdisk.
        #
        # setup-ksu already appended CONFIG_KSU=y to this fragment; keep it.
        grep -qxF 'CONFIG_KSU=y' "$FRAG" || echo 'CONFIG_KSU=y' >> "$FRAG"
        echo "# AVD: GKI defaults kept, KernelSU built in" >> "$FRAG"

        echo "=== Final GKI Fragment ==="
        cat "$FRAG"
        echo "=========================="

        # Copy to kernel arch config dirs
        for dir in "$KERNEL_SRC/arch/x86/configs" "$KERNEL_SRC/arch/arm64/configs"; do
          if [ -d "$dir" ]; then
            cp "$FRAG" "$dir/gki.fragment"
          fi
        done
